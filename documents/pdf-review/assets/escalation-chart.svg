<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="620" viewBox="0 0 1040 620">
    <rect width="1040" height="620" rx="24" fill="#FFFFFF"/>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #243142; }
      .title { font-size: 29px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 17px; fill: #667386; }
      .label { font-size: 20px; font-weight: 700; }
      .detail { font-size: 16px; }
      .tiny { font-size: 14px; font-weight: 700; }
    </style>
      <rect x="0" y="0" width="1040" height="92" rx="24" fill="#183153"/>
    <text x="42" y="42" class="title" fill="#FFFFFF" style="fill:#FFFFFF">SUPPORT SEVERITY ROUTING</text>
    <text x="42" y="70" class="subtitle" fill="#FFFFFF" style="fill:#FFFFFF;opacity:.82">Choose the highest applicable severity</text>
      <rect x="60" y="130" width="920" height="78" rx="14" fill="#FCE9E9" stroke="#B33A3A" stroke-width="2"/>
    <circle cx="110" cy="169" r="28" fill="#B33A3A"/>
    <text x="110" y="177" text-anchor="middle" class="label" style="fill:#FFFFFF">S1</text>
    <text x="160" y="161" class="label">Safety risk or widespread outage</text>
    <text x="160" y="188" class="detail">Owner: Duty manager</text>
    <text x="955" y="176" text-anchor="end" class="label" style="fill:#B33A3A">Immediate</text>
      <rect x="60" y="230" width="920" height="78" rx="14" fill="#FFF2DE" stroke="#B96B16" stroke-width="2"/>
    <circle cx="110" cy="269" r="28" fill="#B96B16"/>
    <text x="110" y="277" text-anchor="middle" class="label" style="fill:#FFFFFF">S2</text>
    <text x="160" y="261" class="label">Material impact; workaround limited</text>
    <text x="160" y="288" class="detail">Owner: Support Operations</text>
    <text x="955" y="276" text-anchor="end" class="label" style="fill:#B96B16">Within 4 hours</text>
      <rect x="60" y="330" width="920" height="78" rx="14" fill="#EAF2FF" stroke="#2E6FD8" stroke-width="2"/>
    <circle cx="110" cy="369" r="28" fill="#2E6FD8"/>
    <text x="110" y="377" text-anchor="middle" class="label" style="fill:#FFFFFF">S3</text>
    <text x="160" y="361" class="label">Single-customer issue; workaround available</text>
    <text x="160" y="388" class="detail">Owner: Standard queue</text>
    <text x="955" y="376" text-anchor="end" class="label" style="fill:#2E6FD8">1 business day</text>
      <rect x="60" y="500" width="920" height="70" rx="12" fill="#F4F6F9"/>
    <text x="82" y="542" class="detail">Record the triggering evidence and next update time before handing off ownership.</text>
    </svg>